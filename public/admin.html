<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace exploitant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Espace exploitant</strong>
    <nav><button class="ghost" onclick="logout()">Déconnexion</button></nav>
  </header>
  <main>
    <section class="card">
      <h2>Récap global</h2>
      <div class="stats">
        <div class="stat"><span id="gServices">–</span><small>Services</small></div>
        <div class="stat"><span id="gHeures">–</span><small>Heures totales</small></div>
        <div class="stat"><span id="gLignes">–</span><small>Lignes différentes</small></div>
        <div class="stat"><span id="gAccidents">–</span><small>Accidents</small></div>
      </div>
      <h3>Par ligne</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ligne</th><th>Services</th><th>Heures</th></tr></thead>
          <tbody id="gTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Conducteurs</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Matricule</th><th>Nom</th><th>Prénom</th><th>Pseudo Roblox</th><th>Rôle</th>
              <th>Heures</th><th>Services</th><th>Lignes</th><th>Accidents</th><th></th>
            </tr>
          </thead>
          <tbody id="uTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitre">Ajouter un compte</h2>
      <form id="uForm">
        <input type="hidden" name="uid">
        <div class="row">
          <label>Matricule <input name="matricule" required></label>
          <label>Nom <input name="nom" required></label>
          <label>Prénom <input name="prenom" required></label>
        </div>
        <div class="row">
          <label>Pseudo Roblox <input name="pseudo"></label>
          <label>Rôle
            <select name="role">
              <option value="conducteur">Conducteur</option>
              <option value="exploitant">Exploitant</option>
            </select>
          </label>
          <label>Mot de passe <input type="password" name="password" autocomplete="new-password"></label>
        </div>
        <p class="muted">Pour la modification, laisser le mot de passe vide pour ne pas le changer.</p>
        <p id="uMsg" class="error"></p>
        <button>Enregistrer</button>
        <button type="button" class="ghost" id="annuler">Annuler</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    let overview = null;
    const form = $("uForm");

    function resetForm() {
      form.reset();
      form.uid.value = "";
      form.password.placeholder = "";
      $("formTitre").textContent = "Ajouter un compte";
      $("uMsg").textContent = "";
    }

    function editer(id) {
      const u = overview.users.find((x) => x.id === id);
      form.uid.value = u.id;
      form.matricule.value = u.matricule;
      form.nom.value = u.nom;
      form.prenom.value = u.prenom;
      form.pseudo.value = u.pseudo || "";
      form.role.value = u.role;
      form.password.value = "";
      form.password.placeholder = "Laisser vide pour ne pas changer";
      $("formTitre").textContent = `Modifier ${u.prenom} ${u.nom}`;
      form.scrollIntoView({ behavior: "smooth" });
    }

    async function load() {
      overview = await api("/admin/overview");
      const t = overview.totals;

      $("gServices").textContent = t.services;
      $("gHeures").textContent = fmtH(t.minutes);
      $("gLignes").textContent = Object.keys(t.lignes).length;
      $("gAccidents").textContent = t.accidents;

      const lignes = Object.entries(t.lignes).sort((a, b) => a[0].localeCompare(b[0], "fr", { numeric: true }));
      $("gTable").innerHTML = lignes.length
        ? lignes.map(([l, v]) => `<tr><td>${esc(l)}</td><td>${v.services}</td><td>${fmtH(v.minutes)}</td></tr>`).join("")
        : `<tr><td colspan="3">Aucun service</td></tr>`;

      $("uTable").innerHTML = overview.users.map((u) => `
        <tr>
          <td>${esc(u.matricule)}</td>
          <td>${esc(u.nom)}</td>
          <td>${esc(u.prenom)}</td>
          <td>${esc(u.pseudo) || "—"}</td>
          <td>${u.role}</td>
          <td>${fmtH(u.stats.minutes)}</td>
          <td>${u.stats.services}</td>
          <td>${esc(Object.keys(u.stats.lignes).join(", ")) || "—"}</td>
          <td>${u.stats.accidents}</td>
          <td><button class="ghost" onclick="editer('${u.id}')">Modifier</button></td>
        </tr>`).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const uid = data.uid;
      delete data.uid;
      if (!data.password) delete data.password;
      $("uMsg").textContent = "";
      try {
        if (uid) await api(`/admin/users/${uid}`, { method: "PUT", body: data });
        else await api("/admin/users", { method: "POST", body: data });
        resetForm();
        await load();
      } catch (err) {
        $("uMsg").textContent = err.message;
      }
    });

    $("annuler").addEventListener("click", resetForm);

    requireUser("exploitant")
      .then(load)
      .catch((e) => console.error(e));
  </script>
</body>
</html>

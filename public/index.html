<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">
  <section class="card login">
    <h1>Connexion</h1>
    <form id="f">
      <label>Matricule <input name="matricule" required autocomplete="username"></label>
      <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
      <p id="err" class="error"></p>
      <button style="width:100%">Se connecter</button>
    </form>
  </section>
  <script src="app.js"></script>
  <script>
    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      try {
        const { token, user } = await api("/login", { method: "POST", body: fd });
        sessionStorage.setItem("token", token);
        location.href = user.role === "exploitant" ? "admin.html" : "driver.html";
      } catch (err) {
        $("err").textContent = err.message;
      }
    });
  </script>
</body>
</html>

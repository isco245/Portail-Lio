<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport de service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Espace conducteur</strong>
    <nav>
      <a href="driver.html">Accueil</a>
      <a href="service.html" class="active">Rapport de service</a>
      <button class="ghost" onclick="logout()">Déconnexion</button>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Nouveau rapport de service</h2>
      <form id="f">
        <label>Date <input type="date" name="date" required></label>
        <label>Ligne <input name="ligne" placeholder="ex : 12" required></label>
        <div class="row">
          <label>Heure de début <input type="time" name="debut" required></label>
          <label>Heure de fin <input type="time" name="fin" required></label>
        </div>
        <fieldset>
          <legend>Accident pendant le service ?</legend>
          <label><input type="radio" name="accident" value="non" checked> Non</label>
          <label><input type="radio" name="accident" value="oui"> Oui</label>
        </fieldset>
        <label id="zoneAccident" hidden>
          Détails de l'accident (facultatif)
          <textarea name="details" rows="5"></textarea>
        </label>
        <p id="msg"></p>
        <button>Envoyer le rapport</button>
      </form>
    </section>
    <section class="card">
      <h3>Mes services</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Ligne</th><th>Horaires</th><th>Durée</th><th>Accident</th></tr>
          </thead>
          <tbody id="historique"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    const today = () =>
      new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

    async function loadHistorique() {
      const rows = await api("/reports");
      $("historique").innerHTML = rows.length
        ? rows.map((r) => `
            <tr>
              <td>${fmtDate(r.date)}</td>
              <td>${esc(r.ligne)}</td>
              <td>${r.debut} – ${r.fin}</td>
              <td>${fmtH(r.minutes)}</td>
              <td>${r.accident ? "Oui" + (r.details ? `<br><small>${esc(r.details)}</small>` : "") : "Non"}</td>
            </tr>`).join("")
        : `<tr><td colspan="5">Aucun rapport</td></tr>`;
    }

    (async () => {
      await requireUser("conducteur");
      const f = $("f");
      const zone = $("zoneAccident");
      f.date.value = today();

      document.querySelectorAll('input[name="accident"]').forEach((r) =>
        r.addEventListener("change", () => (zone.hidden = f.accident.value !== "oui"))
      );

      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(f));
        try {
          await api("/reports", {
            method: "POST",
            body: { ...fd, accident: fd.accident === "oui" },
          });
          f.reset();
          f.date.value = today();
          zone.hidden = true;
          $("msg").className = "success";
          $("msg").textContent = "Rapport enregistré.";
          await loadHistorique();
        } catch (err) {
          $("msg").className = "error";
          $("msg").textContent = err.message;
        }
      });

      await loadHistorique();
    })().catch((e) => console.error(e));
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace conducteur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <strong>Espace conducteur</strong>
    <nav>
      <a href="driver.html" class="active">Accueil</a>
      <a href="service.html">Rapport de service</a>
      <button class="ghost" onclick="logout()">Déconnexion</button>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2 id="titre"></h2>
      <div class="stats">
        <div class="stat"><span id="heures">–</span><small>Heures de conduite</small></div>
        <div class="stat"><span id="services">–</span><small>Services effectués</small></div>
        <div class="stat"><span id="accidents">–</span><small>Accidents déclarés</small></div>
      </div>
    </section>
    <section class="card">
      <h3>Mes informations</h3>
      <dl id="infos"></dl>
      <p class="muted">Pour modifier ces informations, contactez l'exploitant.</p>
    </section>
    <section class="card">
      <h3>Lignes effectuées</h3>
      <ul id="lignes"></ul>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    (async () => {
      const { user, stats } = await requireUser("conducteur");
      $("titre").textContent = `${user.prenom} ${user.nom}`;
      $("heures").textContent = fmtH(stats.minutes);
      $("services").textContent = stats.services;
      $("accidents").textContent = stats.accidents;
      $("infos").innerHTML = [
        ["Matricule", user.matricule],
        ["Nom", user.nom],
        ["Prénom", user.prenom],
        ["Pseudo Roblox", user.pseudo || "—"],
      ].map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

      const lignes = Object.entries(stats.lignes);
      $("lignes").innerHTML = lignes.length
        ? lignes.map(([l, v]) => `<li>Ligne <strong>${esc(l)}</strong> : ${v.services} service(s), ${fmtH(v.minutes)}</li>`).join("")
        : "<li>Aucun service pour l'instant</li>";
    })().catch((e) => console.error(e));
  </script>
</body>
</html>
